<!DOCTYPE html>
<html>
  <head>
    <base target="_blank" />
    <meta charset="utf-8" />
    <title>磨制玄武岩 - Polished Basalt</title>
  </head>
  <style>

      @import url('./p1-base.css');

      body {
          overflow: hidden;
          background-color: rgb(254, 254, 254);
          background-image: linear-gradient(10deg, rgb(218, 219, 222) 0%, rgb(254, 254, 254) 100%);
      }

      p {
          font-size: calc(10px + 1.5vw);
          font-family: Inter, "Noto Sans SC", sans-serif;
          color: rgb(20, 20, 20);
      }

      a {
          color: rgb(20, 20, 20);
      }

      a.large {
          text-decoration: none;
          font-weight: 700;
          padding-inline: 1rem;
          transition: ease 0.125s;
          border-radius: 0;
          box-shadow: 0 0px rgb(16, 76, 184);
          background: none;
          z-index: 0;
          position: relative;
          display: inline-block;
      }
      a.large:hover {
          color: black;
          box-shadow: 6px 3px rgb(16, 76, 184);
      }
      a.large::before,
      a.large::after {
          content: '';
          display: block;
          position: absolute;
          top: 0;
          left: 0;
          height: 100%;
          width: 0;
          z-index: -1;
      }
      a.large::before {
          background-color: rgb(50, 50, 50);
          transition: width 0.2s;
      }
      a.large::after {
          background-color: rgb(61, 71, 202);
          transition: width 0.125s;
      }
      a.large:focus::before,
      a.large:hover::before,
      a.large:focus::after,
      a.large:hover::after {
          width: 100%;
      }
      a.large:focus::before,
      a.large:hover::before {
          transition: width 0.125s;
      }
      a.large:focus::after,
      a.large:hover::after {
          transition: width 0.2s;
      }
      a.small:not(:hover) {
          text-decoration: none;
      }
      ::selection {
          color: rgb(0, 163, 255);
      }

      div.hover img {
          opacity: 0;
          transition: ease 0.125s;
          background-color: rgb(254, 254, 254);
      }

      div.hover {
          background-color: rgb(254, 254, 254);
          background-image: url('./images/Polished Basalt Theme.svg');
          background-size: auto calc(100% - 4rem);
          background-position: center;
          background-repeat: no-repeat;
          border-bottom: 0.25rem solid;
          border-right: 0.5rem solid;
          border-image: linear-gradient(120deg, rgb(var(--basalt-bright-element-color)), rgb(var(--basalt-polished-color))) 1;
          padding: 2rem;
      }

      div.hover:hover img {
          opacity: 1;
      }

  </style>
  <body>

<div style="display: flex; align-content: center; justify-content: center; align-items: center; flex-flow: column wrap; height: 100vh; width: auto; text-align: center;">

    <div class="hover"><img src="'./images/Polished Basalt Theme CN.svg'" alt="basalt" style="width: calc(100px + 30vw);"></div>
    <p style="margin-bottom: 0;"><a class="large" href="https://scp-wiki-cn.wikidot.com/theme:polished-basalt">磨制玄武岩</a></p>
    <p style="margin-top: 0; font-size: 0.9em;"><a class="small" href="https://github.com/JonuarlReden/Polished-Basalt">Github 仓库</a></p>

</div>

<div style="position: absolute; bottom: 0.2rem; left: 2rem; user-select: none;">
    <p style="font-size: 0.9rem;">基于基岩：EstrellaYoshte　Liryn　Placeholder McD, MIT License</p>
    <p style="font-size: 0.9rem;"><span style="margin-right: 4rem;">以及玄武岩：Liryn　Placeholder McD, MIT License</span> CC BY-SA 4.0 </p>
</div>

<div style="position: absolute; bottom: 0.2rem; right: 2rem; user-select: none;">
    <p style="font-size: 0.9rem;">2026　Jonuarl Reden</p>
</div>

</body>
</html>
